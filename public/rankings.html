<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Squares rankings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0e14%27/%3E%3Cg fill=%27none%27 stroke=%27%23ffd23f%27 stroke-width=%271%27%3E%3Crect x=%272%27 y=%272%27 width=%2712%27 height=%2712%27/%3E%3Cpath d=%27M6 2v12M10 2v12M2 6h12M2 10h12%27/%3E%3C/g%3E%3Crect x=%276%27 y=%276%27 width=%274%27 height=%274%27 fill=%27%23ffd23f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 0 0 40px; }
  html { overflow-x: clip; } body { overflow-x: clip; width: 100%; max-width: 100vw; touch-action: pan-y pinch-zoom; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 10px 12px env(safe-area-inset-bottom); }
  h1 { font-size: 19px; margin: 6px 0 2px; letter-spacing: .02em; }
  h1 .sub { color: var(--dim); font-weight: 500; font-size: 13px; }
  h1 a { color: var(--gold); text-decoration: none; font-size: 13px; margin-left: 10px; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; max-width: 100%; min-width: 0; }
  .card h2 { margin: 0 0 9px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 100%; }
  .row > * { min-width: 0; max-width: 100%; }
  select, input[type=search], button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; -webkit-appearance: none; appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  button { cursor: pointer; font-weight: 700; }
  .chipbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; font-weight: 700; cursor: pointer; }
  .chip.on { background: var(--gold); color: #12160c; border-color: var(--gold); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; padding: 6px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  .tbl th.on { color: var(--gold); }
  .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  .tbl td.r { color: var(--dim); width: 34px; }
  .tbl td.n { font-weight: 800; }
  .tbl td.n a { color: inherit; text-decoration: none; }
  .tbl td.sq { color: var(--gold); font-weight: 700; white-space: nowrap; font-size: 13px; }
  .tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
  .tbl tr.me td { background: color-mix(in srgb, var(--gold) 12%, var(--panel)); }
  .tbl tr.me td.n { color: var(--gold); }
  .tbl tr.top td.r { color: var(--gold); font-weight: 900; }
  .tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 480px) { .hide-sm { display: none; } }
  .foot { font-size: 12px; color: var(--dim); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rankings <span class="sub" id="subtitle"></span><a href="/odds">odds grid</a><a href="/">&larr; board</a></h1>

  <div class="card">
    <h2>Week &amp; sort</h2>
    <div class="row">
      <select id="week"></select>
      <div class="chipbar" id="sort">
        <span class="chip on" data-s="expected">$ per game</span>
        <span class="chip" data-s="half">Halftime</span>
        <span class="chip" data-s="final">Final</span>
        <span class="chip" data-s="season">Whole season</span>
      </div>
      <input type="search" id="filter" placeholder="Find a name…" autocomplete="off" autocorrect="off" spellcheck="false" style="flex:1 1 160px">
    </div>
  </div>

  <div class="card">
    <h2 id="title">All players</h2>
    <div class="tblwrap"><table class="tbl" id="tbl"></table></div>
  </div>

  <div class="card"><div class="foot" id="foot"></div></div>
</div>
<script src="/common.js"></script>
<script src="/rankings.js"></script>
</body>
</html>
